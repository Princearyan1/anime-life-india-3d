const r=new T.WebGLRenderer({antialias:true});r.setSize(innerWidth,innerHeight);r.toneMapping=T.ACESFilmicToneMapping;document.body.append(r.domElement);const s=new T.Scene();s.background=new T.Color(0x7c8c88);s.add(new T.HemisphereLight(0xffffff,0x6c5844,2));const light=new T.DirectionalLight(0xffe5ca,3);light.position.set(3,5,4);s.add(light);const cam=new T.PerspectiveCamera(38,innerWidth/innerHeight,.1,100);cam.position.set(1.8,1.6,4);cam.lookAt(0,.95,0);const floor=new T.Mesh(new T.PlaneGeometry(100,100),new T.MeshStandardMaterial({color:0x777f70}));floor.rotation.x=-Math.PI/2;s.add(floor);const chars=new Characters();await chars.load(()=>{});let actor;const p=document.querySelector('#person'),m=document.querySelector('#motion');for(const name of ['Aarav','Sweet seller','Tea seller','Mother','Dadi','Father','Gupta ji','Nurse Meera','Teacher','Bua','Mausi','Didi','Uncle','Farmer','Ramesh','Kabir','Student','Villager']){p.add(new Option(name,name));}function show(){if(actor)s.remove(actor.root);const name=p.value;actor=chars.create(['Mother','Dadi','Nurse Meera','Teacher','Bua','Mausi','Didi','Student'].includes(name)?'female':'male',0x326a83,name==='Aarav'?1.65:1.7,name);s.add(actor.root);actor.play(m.value);}p.onchange=show;m.onchange=()=>actor.play(m.value);show();let last=performance.now();function frame(now){requestAnimationFrame(frame);actor.update(Math.min((now-last)/1000,.05));last=now;r.render(s,cam);}requestAnimationFrame(frame);
